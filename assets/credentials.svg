<svg width="650" height="74" viewBox="0 0 650 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main panel -->
  <rect
    x="4"
    y="8"
    width="642"
    height="58"
    rx="12"
    fill="#050505"
    stroke="#5d0000"
    stroke-width="1.5"
  />

  <!-- Red accent -->
  <rect
    x="4"
    y="8"
    width="5"
    height="58"
    rx="2.5"
    fill="#ff3333"
    filter="url(#glow)"
  />

  <!-- Top subtle line -->
  <path
    d="M28 18 H622"
    stroke="#ff3333"
    stroke-opacity="0.08"
  />

  <!-- Bottom subtle line -->
  <path
    d="M28 55 H622"
    stroke="url(#redLine)"
    stroke-opacity="0.35"
  />

  <!-- Terminal prompt -->
  <text
    x="28"
    y="43"
    font-family="JetBrains Mono, Consolas, monospace"
    font-size="19"
    font-weight="700"
    letter-spacing="1.5"
    fill="#ff4040"
  >&gt; CREDENTIALS &amp; RECOGNITION</text>

  <!-- Status indicator -->
  <circle
    cx="615"
    cy="37"
    r="4"
    fill="#ff3333"
    filter="url(#glow)"
  />
</svg>
